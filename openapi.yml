openapi: 3.1.0
info:
  title: QRLink API
  description: An API for generating and handling dynamic QR codes.
  version: 1.0.0
  contact: 
    name: Creator of QRLink
    email: me@inimicalpart.com
  license:
    name: GNU GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  -
    url: https://qrlink.newseed.se
    description: Production Server
  -
    url: http://localhost:8080
    description: Development Server
paths:
  /api/v1/qrcode/{id}:
    get:
      tags:
        - QRLink-code management
      summary: Get a QRLink-code
      description: >-
        This endpoint allows for retrieving information about a QR-code as well
        as exporting it into different formats, for example `.pdf`, `.png` and
        `.svg`.


        # Responses based on provided information


        You will get different properties based on if you provide the account
        token that the QR-code is linked to in the `Authorization` header, this
        is an example of what it would look like if you do not provide the
        owner's token with this request:

        ``` json

        {
            "id": "31e9597b-1b01-46f9-8e0a-ef80ddf79b2b",
        }

        ```

        It's not much, we know. But on the contrary, if you do specify the
        owner's token, then this is an example of what you would get from the
        server:

        ``` json

        {
            "id": "31e9597b-1b01-46f9-8e0a-ef80ddf79b2b",
            "type": "schedule",
            "data": {
                "monday": {
                    "ALL_DAY": {
                        "redirect_to": "https://inimicalpart.com"
                    }
                }
            },
            "created": "2024-02-05T15:19:12.523Z",
            "updated": "2024-02-05T15:19:12.523Z",
            "name": null,
            "description": null,
            "linked_to": "user_01HNGZJFCVJ6FVFG27196243YM",
            "expires": null,
            "scanCount": 0,
            "scanData": [],
            "settings": {
                "getScanData": false,
                "scanData": {
                    "information": {
                        "fingerprint": false,
                        "user-agent": false,
                        "ip": false,
                        "location": false
                    },
                    "sendToURL": false,
                    "JWTEncryptionKey": ""
                },
                "requirements": {
                    "location": false,
                    "user-agent": false
                }
            }
        }

        ```


        # Exporting


        If `?export=svg,png,pdf` is specified in the request, the returning
        JSON-object will contain the specified export types as properties, as
        seen below. Keep in mind that if you want to export to a `.pdf` file,
        you will need to provide the QR-code owner's token.


        ``` json

        {
            ...
            "svg": "<svg ...>",
            "png": "data:image/png;base64,...",
            "pdf": "data:application/pdf;base64,..."
        }

        ```


        # QRLink API-keys

        This endpoint supports using QRLink API-keys. You can create one using
        the `POST /api/v1/user/api-keys` endpoint. To get a QRLink-code using an
        API-key, the API key needs the `qrcode:read` permission set, and the
        owner of the QRLink-code must exist. Keep in mind that only the API-keys
        issued by the owner will be able to read this QRLink-code.


        To use an API-key for a request, specify it's token in the
        `Authorization` header. All API-keys also need to start with `Bearer `
        if you want the API to understand that you are trying to use an API-key.
      operationId: getAQrlinkCode
      responses:
