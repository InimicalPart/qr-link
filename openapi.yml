  /api/v1/qrcode/{id}/statistics:
    get:
      tags:
        - QRLink-code management
      summary: Get statistics for a QRLink-code
      description: >-
        This endpoint allows you to get statistics for a QRLink-code.


        This is done by specifying at least 3 query parameters: `type`,
        `period_length`, `period_unit`. (or 1 in some cases: `type`)


        `type` - Tells the API what kind of statistic you want. (required)

        `period_length` - Tells the API how far back it should fetch the
        statistics. (required for some types)

        `period_unit` - The unit of which `period_length` is working with.
        (required for some types)


        ## 'type'

        There are 10 types of statistics that you can get.


        `ScannedEachX` - An average count of scans per `period_length` +
        `period_unit`.

        `ScannedLastX` - Retrieve the scans made between now and `period_length`
        + `period_unit` ago.

        `ScannedWhere` - Retrieve the positions of where the last
        `period_length` + `period_unit` scans took place (only works if
        `location` data is saved).

        `ScannedCount` - Get the amount of scans that happened

        `Scanned` - Get all scans that happened, returning only the wanted
        fields if specified, otherwise return all fields.

        `ScannedDayRank` - Get how many scans happened per each week day.

        `ScannedTimeRank` - Get how many scans happened per each hour of the day
        (returns 24H time).

        `ScannedTimeRank12H` - Get how many scans happened per each hour of the
        day (returns 12H time).

        `OS` - Get which operating systems scanned the QRLink-code (only works
        if `user-agent` data is saved).

        `Browser` - Get which browsers scanned the QRLink-code (only works if
        `user-agent` data is saved).


        ## 'period_unit'

        A time unit can be specified to change how far back QRLink should look
        for scans. This is only applicable for the types that need a time to
        look back to.


        The applicable units are: `minute`, `hour`, `day`, `week`, `month`, and
        `year`.


        ## 'period_length'

        This parameter accompanied by `period_unit` tells QRLink how far it
        needs to look back. This parameter may be any number.


        # Additional parameters


        ## 'fields'

        To save network bandwidth, you can also specify what fields of the scan
        data that you're interested in. This is done by specifying the `fields`
        query parameter to be the property that you're interested in. You may
        specify multiple fields by separating them with commas.


        ## 'timezone' 

        Some statistics may require the user's timezone to be provided so that
        they're accurate. This timezone is specified using the `timezone` query
        parameter where the timezone is specified by the TZ identifier. You can
        see all possible timezones
        [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List)



        # QRLink API-keys

        This endpoint supports using QRLink API-keys. You can create one using
        the `POST /api/v1/user/api-keys` endpoint. To get the statistics for a
        QRLink-code using an API-key, the API key needs the `qrcode:read`
        permission set, and the owner of the QRLink-code must exist. Keep in
        mind that only the QRLink-codes owned by the API-key owner will be
        accessible.


        To use an API-key for a request, specify it's token in the
        `Authorization` header. All API-keys also need to start with `Bearer `
        if you want the API to understand that you are trying to use an API-key.
      operationId: getStatisticsForAQrlinkCode
      responses:
        '200':
          description: (200) OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistics:
