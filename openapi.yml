  /api/v1/qrcode/list:
    get:
      tags:
        - QRLink-code management
      summary: Get all QRLink-codes
      description: >-
        This endpoint allows you to retrieve all QR-codes that are linked to
        your account.


        A token has to be passed to the `Authorization` header for this request
        to return successfully.


        # Exporting

        With this endpoint you can also make exports for the QRLink-codes. The
        supported export types are `png` and `svg`. `pdf` is not accessible
        through this endpoint. To get a PDF of the QRLink-code, please use the
        `GET /api/v1/qrcode/<id>` endpoint.


        ``` json

        {
            ...
            "svg": "<svg ...>",
            "png": "data:image/png;base64,...",
            "pdf": "data:application/pdf;base64,..."
        }

        ```


        # Statistics

        You can fetch statistics for each of the QRLink-codes using the
        `statistics` query parameter. 


        To do that, you have to specify which type of statistics you want to
        grab. We use a special format to determine which type of statistics to
        grab. The most common one is `L2M` which stands for `Last 2 Months`.


        At the moment, we only support `Last X Y`. But the period is highly
        customizable.


        `D` = Day(s)

        `W` = Week(s)

        `M` = Month(s)

        `Y` = Year(s)


        For example, to get all scans that occurred in the last 12 months, you
        can either specify `L12M` or `L1Y`.


        ## Additional parameters


        ### 'fields'

        To save network bandwidth, you can also specify what fields of the scan
        data that you're interested in. This is done by specifying the `fields`
        query parameter to be the property that you're interested in. You may
        specify multiple fields by separating them with commas. Here is an
        examples:


        ```

        https://qrlink.website.com/api/v1/qrcode/list?statistics=L2M&fields=timestamp,user-agent

        ```

        This will retrieve the scans that happened in the last 2 months, and
        only give you the `timestamp` and `user-agent` fields of each scan,
        saving bandwidth.


        ### 'timezone'

        Some statistics may require the user's timezone to be provided so that
        they're accurate. This timezone is specified using the `timezone` query
        parameter where the timezone is specified by the TZ identifier. You can
        see all possible timezones
        [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List)





        # QRLink API-keys

        This endpoint supports using QRLink API-keys. You can create one using
        the `POST /api/v1/user/api-keys` endpoint. To get all QRLink-codes using
        an API-key, the API key needs the `qrcode:read` permission set, and the
        owner of the QRLink-code must exist. Keep in mind that only the
        QRLink-codes owned by the API-key owner will show up.


        To use an API-key for a request, specify it's token in the
        `Authorization` header. All API-keys also need to start with `Bearer `
        if you want the API to understand that you are trying to use an API-key.
      operationId: getAllQrlinkCodes
      responses:
