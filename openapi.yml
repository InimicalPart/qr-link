    delete:
      tags:
        - User API-keys
      summary: Revoke an API-key
      description: >-
        This endpoint allows you to revoke an API-key. The API-key owner's token
        has to be provided.


        **Revoking an API key will make it no longer usable. All applications
        using this token will instantly stop working.**


        # Using QRLink API-keys

        This endpoint supports using QRLink API-keys. You can create one using
        the `POST /api/v1/user/api-keys` endpoint. If you're using an API-key
        for this request, the API-key has to have the `api:delete-self`
        permission and the ID needs to be the provided API-key's ID or `@me`.
        API-key's do not have the possibility of deleting other API-keys, in
        which case the request will bounce with a `403 Forbidden` status code.
         
        To use an API-key for a request, specify it's token in the
        `Authorization` header. All API-keys also need to start with `Bearer `
        if you want the API to understand that you are trying to use an API-key.
      operationId: revokeAnApiKey
      responses:
        '200':
          description: (200) OK (as user) / (200) OK (as API)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    examples:
                    - >-
                      3af0aa5cddba806143a567a7162611e637d8fe188e070dfcfbc1e7e0b4fe73f1
              examples:
                (200) OK (as API):
                  value:
                    id: >-
                      3af0aa5cddba806143a567a7162611e637d8fe188e070dfcfbc1e7e0b4fe73f1
