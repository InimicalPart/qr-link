        Once the server detects a web request to this endpoint, it gets the
        specified QR-code and checks what is the currently active action. Once
        done, it will redirect the user based on the QR-code's settings and
        redirect information.


        If a VCard is specified in `data.*.redirect_to` or
        `data.*.after_expiry`, then instead of redirecting, the server will
        create a page that will automatically download the VCard to the user's
        device. Some tracking methods like fingerprinting, IP grabbing and
        location grabbing, are not available during this.
