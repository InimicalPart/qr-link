  /qrcode/{id}:
    get:
      summary: Get a dynamic QR-code
      description: >-
        This endpoint allows for retrieving information about a QR-code as well
        as exporting it into different formats, for example `.pdf`, `.png` and
        `.svg`.


        # Responses based on provided information


        You will get different properties based on if you provide the account
        token that the QR-code is linked to in the `Authorization` header, this
        is an example of what it would look like if you do not provide the
        owner's token with this request:

        ``` json

        {
            "id": "31e9597b-1b01-46f9-8e0a-ef80ddf79b2b",
            "created": "2024-02-05T15:19:12.523Z",
            "updated": "2024-02-05T15:19:12.523Z"
        }

        ```

        It's not much, we know. But on the contrary, if you do specify the
        owner's token, then this is an example of what you would get from the
        server:

        ``` json

        {
            "id": "31e9597b-1b01-46f9-8e0a-ef80ddf79b2b",
            "type": "redirect",
            "data": {
                "redirect_to":"https://inimicalpart.com"
            },
            "update_key": "d176af628d129a9afdc230a810237c9cb2c844f0c350f9119bfd2221d1c738fe",
            "created": "2024-02-05T15:19:12.523Z",
            "updated": "2024-02-05T15:19:12.523Z",
            "name": null,
            "description": null,
            "linked_to": "user_01HNGZJFCVJ6FVFG27196243YM",
            "expires": null,
            "scanCount": 0,
            "scanData": [],
            "settings": {
                "getScanData": false,
                "scanData": {
                    "fingerprint": false,
                    "user-agent": false,
                    "timestamp": false,
                    "ip": false,
                    "location": false
                },
                "requirements": {
                    "location": false
                }
            }
        }

        ```


        # Exporting


        If `?export=svg,png,pdf` is specified in the request, the returning
        JSON-object will contain the specified export types as properties, as
        seen below. Keep in mind that if you want to export to a `.pdf` file,
        you will need to provide the QR-code owner's token.


        ``` json

        {
            ...
            "svg": "<svg ...>",
            "png": "data:image/png;base64,...",
            "pdf": "data:application/pdf;base64,..."
        }

        ```
