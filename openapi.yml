openapi: 3.1.0
info:
  title: QRLink API
  description: An API for generating and handling dynamic QR codes.
  version: 1.0.0
  contact: 
    name: Creator
    email: me@inimicalpart.com
  license:
    name: GNU GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  -
    url: http://localhost:3000
    description: Development Server
paths:
  /qrcode:
    post:
      summary: Create a new dynamic QR-code
      description: >-
        This endpoint allows the user to create a QR-code on the server.


        This is an example of how what a request to this endpoint could look
        like:


        ``` json

        {
            "id": "ThisIsMyCustomQRCodeID", // if not provided, will be randomly generated
            "update_key": "MyV3ryS3cretPa55w0rd!", // if not provided, will be randomly generated
            "type": "redirect",
            "data": {
              "redirect_to":"https://inimicalpart.com" // main redirect
              "after_expiry":"https://google.com" // where to go after the QR-code expires
            }
        }

        ```

        It is also recommended to provide your token (using the `Authorization`
        header) as if you do so, the QR-code will automatically be linked to
        your account. If you forget to do this, you can link a QR-code to your
        account using `PATCH /qrcode/:id` and passing in the `token` property
        with your token.


        Here are all properties that you could specify to this request:


        | Property | Default Value | Description |

        | --- | --- | --- |

        | `id` | `<UUID>` | The QR-code's identifier, used in most requests to
        the server. | 

        | `update_key` | `<random 32-long string>` | The key used to update the
        QR-codes information. |

        | `type` | N/A | The type of action that this QR-code is gonna do,
        currently supported: `redirect`. |

        | `data` | N/A | The redirect information for the QR-code. Has to be an
        object. |

        | `data.redirect_to` | N/A | Used to specify where the QR-code will
        point to, cannot be used with `data.schedule`. |

        | `data.after_expiry` | `<a page saying the QR-code has expired>` | Used
        to specify where the QR-code will point to after it has expired, cannot
        be used with `data.schedule`. |

        | `data.schedule` | N/A | Used to specify different actions for each day
        of the week and time, cannot be used with `data.redirect_to` or
        `data.after_expiry`. |

        | `data.schedule.<monday-friday>` | N/A | Used to specify an action for
        the specified day of the week, has to be an object. |

        | `data.schedule.<monday-friday>.<HH:MM/"ALL_DAY">` | N/A | Used to
        specify an action for the specified day of the week. This also allows
        for specifying a time in the `HH:MM` format or `"ALL_DAY"` for the
        entire day. The system goes back to the last passed time to find the
        action to run. |

        | `data.schedule.<monday-friday>.<HH:MM/"ALL_DAY">.redirect_to` | N/A |
        Same as `data.redirect_to`, but for the specified DotW and time. |

        | `data.schedule.<monday-friday>.<HH:MM/"ALL_DAY">.after_expiry` | N/A |
        Same as `data.after_expiry`, but for the specified DotW and time. |

        | `data.schedule.timezone` | `<server's timezone>` | The timezone that
        will apply to the schedule, has to be specified in the TZ format. See
        more
        [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones). |

        | `expires` | `null` | When the QR-code expires, has to be `null` or be
        specified in the `YYYY-MM-DDTHH:MM` format, example (Feb 6th, 2024 @
        1:06 PM): `2024-02-06T13:06`. |

        | `name` | `null` | The QR-code's name, this name shows up on the
        QRLink UI. Max 50 chars, has to be `null` or a string. |

        | `description` | `null` | The QR-code's description, this description
        shows up on the QRLink UI. Max 200 chars, has to be `null` or a
        string. |

        | `settings` | `{}` | The settings that the QR-code follows. |

        | `settings.getScanData` | `true` | Get information about each scan. |

        | `sett.scanData` | `{}` | More in-depth settings about what to
        collect, beware of your country's privacy laws, as this could violate
        them. |

        | `settings.scanData.fingerprint` | `false` | Grab the scanning device's
        fingerprint. Does not work when scanning VCards. |

        | `settings.scanData.user-agent` | `false` | Grab the scanning device's
        user-agent |

        | `settings.scanData.timestamp` | `true` | Grab when the QR-code was
        scanned. |

        | `settings.scanData.ip` | `false` | Grab the scanning device's IP
        address. Does not work when scanning VCards. |

        | `settings.scanData.location` | `false` | Grab the scanning device's
        location. Does not work when scanning VCards.|

        | `settings.requirements` | `{}` | Define what has to be sent for the
        user to be able to get redirected |

        | `settings.requirements.location` | `false` | Only allow redirect if
        user has allowed us to grab location. Only works if
        `settings.scanData.location` and `settings.getScanData` are both set to
        `true` |
      operationId: qrcode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    redirect_to:
                      type: string
                      examples:
                      - https://inimicalpart.com
                type:
                  type: string
                  examples:
                  - redirect
            examples:
              /qrcode:
                value:
                  data:
                    redirect_to: https://inimicalpart.com
                  type: redirect
          text/plain:
            examples:
              /qrcode:
                value: ''
      responses:
        '200':
          description: (200) OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                examples:
                - '*'
            Connection:
              schema:
                type: string
                examples:
                - keep-alive
            Content-Length:
              schema:
                type: string
                examples:
                - '4340'
            Date:
              schema:
                type: string
                examples:
                - Tue, 06 Feb 2024 08:10:45 GMT
            ETag:
              schema:
                type: string
                examples:
                - W/"10f4-80g/kSrO2AfuKgOBsB1amz3Njuw"
            Keep-Alive:
              schema:
                type: string
                examples:
                - timeout=5
            X-Powered-By:
              schema:
                type: string
                examples:
                - Express
