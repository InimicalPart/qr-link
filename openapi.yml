  /api/v1/user/api-keys/{id}:
    get:
      tags:
        - User API-keys
      summary: Get an API-key
      description: >-
        Get details about an API key owned by the request maker. A token is
        required for this request.


        This request will return a token preview, which are the first and last 7
        characters of the token, but it will never return the full token for
        safety reasons.


        # Using QRLink API-keys

        This endpoint supports using QRLink API-keys. You can create one using
        the `POST /api/v1/user/api-keys` endpoint. Using an API-key on this
        endpoint only allows for the API-key to retrieve information about
        itself. It can do that by specifying `@me` or its own ID in the `id`
        part of the URL. An API token may not get details about other API-keys.


        To use an API-key for a request, specify it's token in the
        `Authorization` header. All API-keys also need to start with `Bearer `
        if you want the API to understand that you are trying to use an API-key.
      operationId: getAnApiKey
      responses:
        '200':
          description: (200) OK (as user) / (200) OK (as API)
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: string
                    examples:
                    - '2024-03-19T10:44:03.264Z'
                  id:
                    type: string
                    examples:
                    - >-
                      3af0aa5cddba806143a567a7162611e637d8fe188e070dfcfbc1e7e0b4fe73f1
                  last_used:
                    type: "null"
                    examples:
                    - null
                  name:
                    type: "null"
                    examples:
                    - null
                  permissions:
                    type: array
                    items:
                      type: string
                      examples:
                      - api:delete-self
                    examples:
                      - api:delete-self
                      - api:update-self
                      - qrcode:create
                      - qrcode:delete
                      - qrcode:read
                      - qrcode:update
                  token_preview:
                    type: string
                    examples:
                    - eyJhbGc...bFlS9MQ
              examples:
                (200) OK (as API):
                  value:
                    created: '2024-03-19T10:44:03.264Z'
                    id: >-
                      3af0aa5cddba806143a567a7162611e637d8fe188e070dfcfbc1e7e0b4fe73f1
                    last_used: null
                    name: null
                    permissions:
                      - api:delete-self
                      - api:update-self
                      - qrcode:create
                      - qrcode:delete
                      - qrcode:read
                      - qrcode:update
                    token_preview: eyJhbGc...bFlS9MQ
                (200) OK (as user):
                  value:
                    created: '2024-03-19T10:44:03.264Z'
