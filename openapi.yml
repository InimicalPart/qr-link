    patch:
      summary: Update a dynamic QR-code
      description: >-
        This endpoint allows you to update a QR-code, for example where it
        points to, it's name, it's description, etc.


        Here is an example of what a successful request would like:

        ``` json

        {
            "update_key": "d176af628d129a9afdc230a810237c9cb2c844f0c350f9119bfd2221d1c738fe",
            "update": {
                "type":"redirect",
                "data": {
                    "redirect_to":"https://inimicalpart.com",
                    "after_expiry":"https://google.com"
                },
                "update_key":"mynewupdatekey",
                "linked_to": "eyJhbGciOiJIUzI...YKnApEMA",
                "expires": "2024-11-15T21:42:00",
                "id": "mynewid",
                "description": "This QR-code signifies the importance of Dynamic QR-codes and how with them, the world has no limits.",
                "name": "QRLink Sample",
                "settings": {
                    "getScanData": true,
                    "scanData": {
                        "fingerprint": true,
                        "user-agent": true,
                        "timestamp": true,
                        "ip": false,
                        "location": false 
                    },
                    "requirements": {
                        "location": false
                    }
                }
            }
        }

        ```


        You also don't need to specify all of the properties, you can simply
        just specify the one you want to change.


        Here are all properties that you could specify to this request:


        | Property | Description |

        | --- | --- |

        | `update_key` | The key used to update the QR-codes information, you
        need this key to do this update. |

        | `update.id` | The QR-code's identifier, used in most requests to the
        server. | 

        | `update.update_key` | The key used to update the QR-codes information.
        |

        | `update.type` | The type of action that this QR-code is gonna do,
        currently supported: `redirect`. |

        | `update.data.redirect_to` | Used to specify where the QR-code will
        point to, cannot be used with `data.schedule`. |

        | `update.data.after_expiry` | Used to specify where the QR-code will
        point to after it has expired, cannot be used with `data.schedule`. |

        | `update.data.schedule` | Used to specify different actions for each
        day of the week and time, cannot be used with `data.redirect_to` or
        `data.after_expiry`. |

        | `update.data.schedule.<monday-friday>` | Used to specify an action for
        the specified day of the week, has to be an object. |

        | `update.data.schedule.<monday-friday>.<HH:MM/"ALL_DAY">` | Used to
        specify an action for the specified day of the week. This also allows
        for specifying a time in the `HH:MM` format or `"ALL_DAY"` for the
        entire day. The system goes back to the last passed time to find the
        action to run. |

        | `update.data.schedule.<monday-friday>.<HH:MM/"ALL_DAY">.redirect_to` |
        Same as `data.redirect_to`, but for the specified DotW and time. |

        | `update.data.schedule.<monday-friday>.<HH:MM/"ALL_DAY">.after_expiry`
        | Same as `data.after_expiry`, but for the specified DotW and time. |

        | `update.data.schedule.timezone` | The timezone that will apply to the
        schedule, has to be specified in the TZ format. See more
        [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones). |

        | `update.expires` | When the QR-code expires, has to be `null` or be
        specified in the `YYYY-MM-DDTHH:MM` format, example (Feb 6th, 2024 @
        1:06 PM): `2024-02-06T13:06`. |

        | `update.name` | The QR-code's name, this name shows up on the
        QRLink UI. Max 50 chars, has to be `null` or a string. |

        | `update.description` | The QR-code's description, this description
        shows up on the QRLink UI. Max 200 chars, has to be `null` or a
        string. |

        | `update.linked_to` | The token to the account that this QR-code should
        link to. |

        | `update.settings.getScanData` | Get information about each scan. |

        | `update.settings.scanData.fingerprint` | Grab the scanning device's
        fingerprint. Does not work when scanning VCards. |

        | `update.settings.scanData.user-agent` | Grab the scanning device's
        user-agent |

        | `update.settings.scanData.timestamp` | Grab when the QR-code was
        scanned. |

        | `update.settings.scanData.ip` | Grab the scanning device's IP address.
        Does not work when scanning VCards. |

        | `update.settings.scanData.location` | Grab the scanning device's
        location. Does not work when scanning VCards.|

        | `update.settings.requirements.location` | Only allow redirect if user
        has allowed us to grab location. Only works if
        `settings.scanData.location` and `settings.getScanData` are both set to
        `true` |
      operationId: qrcodeId1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                update:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        after_expiry:
                          type: string
                          examples:
                          - https://google.com
                        redirect_to:
                          type: string
                          examples:
                          - https://inimicalpart.com
                    description:
                      type: string
                      examples:
                      - >-
                        This QR-code signifies the importance of Dynamic
                        QR-codes and how with them, the world has no limits.
                    expires:
                      type: string
                      examples:
                      - '2024-11-15T21:42:00'
                    id:
                      type: string
                      examples:
                      - mynewid
                    linked_to:
                      type: string
                      examples:
                      - >-
                        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..6wE6B-KpJsVuvcNwQZFVrLjX_MsNA9CjFTKYKnApEMA
                    name:
                      type: string
                      examples:
                      - QRLink Sample
                    settings:
                      type: object
                      properties:
                        getScanData:
                          type: boolean
                          examples:
                          - true
                        requirements:
                          type: object
                          properties:
                            location:
                              type: boolean
                              examples:
                              - false
                        scanData:
                          type: object
                          properties:
                            fingerprint:
                              type: boolean
                              examples:
                              - true
                            ip:
                              type: boolean
                              examples:
                              - false
                            location:
                              type: boolean
                              examples:
                              - false
                            timestamp:
                              type: boolean
                              examples:
                              - true
                            user-agent:
                              type: boolean
                              examples:
                              - true
                    type:
                      type: string
                      examples:
                      - redirect
                    update_key:
                      type: string
                      examples:
                      - mynewupdatekey
                update_key:
                  type: string
                  examples:
                  - >-
                    d176af628d129a9afdc230a810237c9cb2c844f0c350f9119bfd2221d1c738fe
            examples:
              /qrcode/:id:
                value:
                  update:
                    data:
                      after_expiry: https://google.com
                      redirect_to: https://inimicalpart.com
                    description: >-
                      This QR-code signifies the importance of Dynamic QR-codes
                      and how with them, the world has no limits.
                    expires: '2024-11-15T21:42:00'
                    id: mynewid
                    linked_to: >-
                      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..6wE6B-KpJsVuvcNwQZFVrLjX_MsNA9CjFTKYKnApEMA
                    name: QRLink Sample
                    settings:
                      getScanData: true
                      requirements:
                        location: false
                      scanData:
                        fingerprint: true
                        ip: false
                        location: false
                        timestamp: true
                        user-agent: true
                    type: redirect
                    update_key: mynewupdatekey
                  update_key: >-
                    d176af628d129a9afdc230a810237c9cb2c844f0c350f9119bfd2221d1c738fe
          text/plain:
            examples:
              /qrcode/:id:
                value: ''
