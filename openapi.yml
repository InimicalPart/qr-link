  /srvinfo:
    get:
      summary: Get server information
      description: >-
        This endpoint is used by QRLink UI to ask the server for the server
        URL that it has. We do this so that the server and QRLink UI are in
        sync with what URL should be used to communicate to the server. This
        endpoint simply returns the server URL that the server has as well as
        QRLink's version. You can see an example of what a response from this
        endpoint looks like.


        ``` json

        {
            "serverURL": "http://localhost:3000",
            "version": "1.0.0"
        }

        ```
      operationId: srvinfo
      responses:
        '200':
          description: (200) OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                examples:
                - '*'
            Connection:
              schema:
                type: string
                examples:
                - keep-alive
            Content-Length:
              schema:
                type: string
                examples:
                - '55'
            Date:
              schema:
                type: string
                examples:
                - Tue, 06 Feb 2024 09:40:29 GMT
            ETag:
              schema:
                type: string
                examples:
                - W/"37-Ky+l0MfvdrPxhTYB14EMfGn3kqA"
            Keep-Alive:
              schema:
                type: string
                examples:
                - timeout=5
            X-Powered-By:
              schema:
                type: string
                examples:
                - Express
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverURL:
                    type: string
                    examples:
                    - http://localhost:3000
                  version:
                    type: string
                    examples:
                    - 1.0.0
              examples:
                (200) OK:
                  value:
                    serverURL: http://localhost:3000
                    version: 1.0.0
