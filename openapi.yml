    delete:
      tags:
        - QRLink-code management
      summary: Delete a QRLink-code
      description: >-
        This endpoint allows you to delete a QRLink-code. To delete a
        QRLink-code, you need to be an owner of the code. A token for this
        endpoint is required.


        # QRLink API-keys

        This endpoint supports using QRLink API-keys. You can create one using
        the `POST /api/v1/user/api-keys` endpoint. To delete a QRLink-code using
        an API-key, the API key needs the `qrcode:delete` permission set, and
        the owner of the QRLink-code must exist. Keep in mind that only the
        QRLink-codes owned by the API-key owner will be accessible.


        To use an API-key for a request, specify it's token in the
        `Authorization` header. All API-keys also need to start with `Bearer `
        if you want the API to understand that you are trying to use an API-key.
      operationId: deleteAQrlinkCode
      responses:
        '200':
          description: (200) OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    examples:
                    - 31e9597b-1b01-46f9-8e0a-ef80ddf79b2b
              examples:
                (200) OK:
                  value:
                    id: 31e9597b-1b01-46f9-8e0a-ef80ddf79b2b
        '400':
          description: >-
            (400) Invalid ID provided / (400) API - Owner doesn't exist / (400)
            Invalid token provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - INVALID_ID
                  message:
                    type: string
                    examples:
                    - Invalid ID provided.
              examples:
                (400) API - Owner doesn't exist:
                  value:
                    error: INVALID_OWNER
                    message: The owner of this API token does not exist.
                (400) Invalid ID provided:
                  value:
                    error: INVALID_ID
                    message: Invalid ID provided.
                (400) Invalid token provided:
                  value:
                    error: INVALID_TOKEN
                    message: Invalid token.
        '401':
          description: (401) No token provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - NO_TOKEN
                  message:
                    type: string
                    examples:
                    - No token provided in request.
              examples:
                (401) No token provided:
                  value:
                    error: NO_TOKEN
                    message: No token provided in request.
        '403':
          description: (403) API - Invalid Permissions / (403) Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - INVALID_PERMISSIONS
                  message:
                    type: string
                    examples:
                    - >-
                      The token provided does not have the required permissions
                      to access this resource.
              examples:
                (403) API - Invalid Permissions:
                  value:
                    error: INVALID_PERMISSIONS
                    message: >-
                      The token provided does not have the required permissions
                      to access this resource.
                (403) Unauthorized:
                  value:
                    error: UNAUTHORIZED
                    message: You are not authorized to delete this QRCode.
    patch:
      tags:
        - QRLink-code management
      summary: Update a QRLink-code
      description: >-
        This endpoint allows you to update a QR-code, for example where it
        points to, it's name, it's description, etc. A token is required for
        this endpoint.


        Here is an example of what a successful request would like:

        ``` json

        {
            "update": {
                "name": "QRLink Sample",
                "description": "This QR-code signifies the importance of Dynamic QR-codes and how with them, the world has no limits.",
                "type":"redirect",
                "data": {
                    "redirect_to":"https://inimicalpart.com",
                    "after_expiry":"https://google.com"
                },
                "linked_to": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..6wE6B-KpJsVuvcNwQZFVrLjX_MsNA9CjFTKYKnApEMA",
                "expires": "2024-11-15T21:42:00.000Z",
                "settings": {
                    "getScanData": false,
                    "scanData": {
                        "information": {
                            "fingerprint": false,
                            "user-agent": false,
                            "ip": false,
                            "location": false
                        },
                        "sendToURL": false,
                        "JWTEncryptionKey": ""
                    },
                    "requirements": {
                        "location": false,
                        "user-agent":false
                    }
                }
            }
        }

        ```


        You also don't need to specify all of the properties, you can simply
        just specify the one you want to change.


        Here are all properties that you could specify to this request:


        | Property | Description |

        | --- | --- |

        | `update.type` | The type of action that this QR-code is gonna do,
        currently supported: `redirect`, `location`, `schedule`, and
        `user-agent`. |

        | `update.data.redirect_to` | (type: `redirect`) Used to specify where
        the QR-code will point to |

        | `update.data.after_expiry` | (type: `redirect`)  Used to specify where
        the QR-code will point to after it has expired. |

        | | |

        | `update.data.<monday-sunday>.<HH:MM/"ALL_DAY">.redirect_to` | (type:
        `schedule`) Same as `update.data.redirect_to`, but for the specified
        DotW and time. |

        | `update.data.<monday-sunday>.<HH:MM/"ALL_DAY">.after_expiry` | (type:
        `schedule`) Same as `update.data.after_expiry`, but for the specified
        DotW and time. |

        | `update.data.timezone` | (type: `schedule`) The timezone that will
        apply to the schedule, has to be specified in the TZ format. See more
        [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones). |

        | | |

        | `update.data.zones.*.type` | (type: `location`) Defines what the form
        of the zone is. Supported forms: `polygon`, `circle` |

        | `update.data.zones.*.priority` | (type: `location`) Defines what
        priority this zone has, this is used when 2 zones are overlapping. The
        one with the highest priority will be chosen |

        | `update.data.zones.*.isEntireWorld` | (type: `location`) Defines if a
        zone is covering the entire world. A polygon zone covering the entire
        world is defined as a fallback, and should have a priority of `-1000`.
        The server does not check this and unexpected outcomes may occur if this
        is not set correctly. |

        | `update.data.zones.*.positions` | (type: `location`) An array of
        polygon points specified in the `[[lat, long], ...]` format |

        | `update.data.zones.*.center` | (type: `location`) The center of a
        circle zone specified in the `[lat, long]` format |

        | `update.data.zones.*.radius` | (type: `location`) The radius (in
        meters) of the circle zone |

        | `update.data.zones.*.redirectTo` | (type: `location`) Same as
        `update.data.redirect_to`, but for the `location` type |

        | `update.data.zones.*.afterExpiry` | (type: `location`) Same as
        `update.data.after_expiry`, but for the `location` type |

        | | |

        | `update.data.userAgents.*.browser` | (type: `user-agent`) A regex
        string for a user-agent that determines if it's a browser that you're
        looking for |

        | `update.data.userAgents.*.browser_name` | (type: `user-agent`) A
        user-friendly name for the browser you're looking for |

        | `update.data.userAgents.*.os` | (type: `user-agent`) A regex string
        for a user-agent that determines if it's an OS that you're looking for |

        | `update.data.userAgents.*.os_name` | (type: `user-agent`) A
        user-friendly name for the OS you're looking for |

        | `update.data.userAgents.*.redirect_to` | (type: `user-agent`) Same as
        `update.data.redirect_to`, but for the `user-agent` type |

        | `update.data.userAgents.*.after_expiry` | (type: `user-agent`) Same as
        `update.data.after-expiry`, but for the `user-agent` type |

        | | |

        | `update.expires` | When the QR-code expires, has to be `null` or be
        specified in the `YYYY-MM-DDTHH:MM:SS.sssZ` format, example (Feb 6th,
        2024 @ 1:06 PM (UTC)): `2024-02-06T13:06:00.000Z`. |

        | `update.name` | The QR-code's name, this name shows up on the
        DynamicQR UI. Max 50 chars, has to be `null` or a string. |

        | `update.description` | The QR-code's description, this description
        shows up on the DynamicQR UI. Max 200 chars, has to be `null` or a
        string. |

        | `update.settings.getScanData` | Get information about each scan. |

        | `update.settings.scanData` | More in-depth settings about what to
        collect, beware of your country's privacy laws, as this could violate
        them. |

        | `update.settings.scanData.information.fingerprint` | Grab the scanning
        device's fingerprint. |

        | `update.settings.scanData.information.user-agent` | Grab the scanning
        device's user-agent. |

        | `update.settings.scanData.information.ip` | Grab the scanning device's
        IP address. |

        | `update.settings.scanData.information.location` | Grab the scanning
        device's location. |

        | `update.settings.scanData.sendToURL` | Sends the collected scan data
        to the website that the user gets redirected to. This is done passing a
        signed JWT token through the `ql_scan` query parameter on the redirect
        website.  |

        | `update.settings.scanData.JWTEncryptionKey` | The key used to sign the
        scan data. This has to be provided if
        `update.settings.scanData.sendToURL` is set to true |

        | `update.settings.requirements.location` | Only allow redirect if user
        has allowed us to grab location. Only works if
        `update.settings.scanData.information.location` and
        `update.settings.getScanData` are both set to `true` |

        | `update.settings.requirements.user-agent` | Only allow redirect if
        user has allowed us to grab device and browser information. Only works
        if `update.settings.scanData.information.user-agent` and
        `update.settings.getScanData` are both set to `true` |


        # QRLink API-keys

        This endpoint supports using QRLink API-keys. You can create one using
        the `POST /api/v1/user/api-keys` endpoint. To update a QRLink-code using
        an API-key, the API key needs the `qrcode:update` permission set, and
        the owner of the QRLink-code must exist. Keep in mind that only the
        QRLink-codes owned by the API-key owner will be accessible.


        To use an API-key for a request, specify it's token in the
        `Authorization` header. All API-keys also need to start with `Bearer `
        if you want the API to understand that you are trying to use an API-key.
      operationId: updateAQrlinkCode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                update:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        after_expiry:
                          type: string
                          examples:
                          - https://google.com
                        redirect_to:
                          type: string
                          examples:
                          - https://inimicalpart.com
                    description:
                      type: string
                      examples:
                      - >-
                        This QR-code signifies the importance of Dynamic
                        QR-codes and how with them, the world has no limits.
                    expires:
                      type: string
                      examples:
                      - '2024-11-15T21:42:00.000Z'
                    linked_to:
                      type: string
                      examples:
                      - >-
                        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..6wE6B-KpJsVuvcNwQZFVrLjX_MsNA9CjFTKYKnApEMA
                    name:
                      type: string
                      examples:
                      - QRLink Sample
                    settings:
                      type: object
                      properties:
                        getScanData:
                          type: boolean
                          examples:
                          - false
                        requirements:
                          type: object
                          properties:
                            location:
                              type: boolean
                              examples:
                              - false
                            user-agent:
                              type: boolean
                              examples:
                              - false
                        scanData:
                          type: object
                          properties:
                            JWTEncryptionKey:
                              type: string
                              examples:
                              - ''
                            information:
                              type: object
                              properties:
                                fingerprint:
                                  type: boolean
                                  examples:
                                  - false
                                ip:
                                  type: boolean
                                  examples:
                                  - false
                                location:
                                  type: boolean
                                  examples:
                                  - false
                                user-agent:
                                  type: boolean
                                  examples:
                                  - false
                            sendToURL:
                              type: boolean
                              examples:
                              - false
                    type:
                      type: string
                      examples:
                      - redirect
            examples:
              Update a QRLink-code:
                value:
                  update:
                    data:
                      after_expiry: https://google.com
                      redirect_to: https://inimicalpart.com
                    description: >-
                      This QR-code signifies the importance of Dynamic QR-codes
                      and how with them, the world has no limits.
                    expires: '2024-11-15T21:42:00.000Z'
                    linked_to: >-
                      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..6wE6B-KpJsVuvcNwQZFVrLjX_MsNA9CjFTKYKnApEMA
                    name: QRLink Sample
                    settings:
                      getScanData: false
                      requirements:
                        location: false
                        user-agent: false
                      scanData:
                        JWTEncryptionKey: ''
                        information:
                          fingerprint: false
                          ip: false
                          location: false
                          user-agent: false
                        sendToURL: false
                    type: redirect
          text/plain:
            examples:
              Update a QRLink-code:
                value: this-isnt-json
      responses:
        '200':
          description: (200) OK
          content:
            application/json:
              schema:
                type: object
