  /api/v1/qrcode:
    post:
      tags:
        - QRLink-code management
      summary: Create QRLink-code
      description: >-
        This endpoint allows the user to create a QR-code on the server.


        This is an example of how what a request to this endpoint could look
        like:


        ``` json

        {
            "type": "redirect",
            "data": {
              "redirect_to": "https://inimicalpart.com" // main redirect
              "after_expiry": "https://google.com" // where to go after the QR-code expires
            }
        }

        ```

        It is also required to provide your token (using the `Authorization`
        header). By doing that, the QR-code will automatically be linked to your
        account. If you forget to do this, you can link a QR-code to your
        account using `PATCH /api/v1/qrcode/:id` and passing in your token in
        the `update.linked_to` property.


        Here are all properties that you could specify to this request:


        | Property | Default Value | Description |

        | --- | --- | --- |

        | `type` | N/A | The type of action that this QR-code is gonna do,
        currently supported: `redirect`, `location`, `schedule`, and
        `user-agent`. |

        | `data` | N/A | The redirect information for the QR-code. Has to be an
        object. |

        | | |

        | `data.redirect_to` | N/A | (type: `redirect`) Used to specify where
        the QR-code will point to |

        | `data.after_expiry` | `<a page saying the QR-code has expired>` |
        (type: `redirect`)  Used to specify where the QR-code will point to
        after it has expired. |

        | | |

        | `data.<monday-sunday>` | N/A | (type: `schedule`) Used to specify an
        action for the specified day of the week, has to be an object. |

        | `data.<monday-sunday>.<HH:MM/"ALL_DAY">` | N/A | (type: `schedule`)
        Used to specify an action for the specified day of the week. This also
        allows for specifying a time in the `HH:MM` format or `"ALL_DAY"` for
        the entire day. The system goes back to the last passed time to find the
        action to run. |

        | `data.<monday-sunday>.<HH:MM/"ALL_DAY">.redirect_to` | N/A | (type:
        `schedule`) Same as `data.redirect_to`, but for the specified DotW and
        time. |

        | `data.<monday-sunday>.<HH:MM/"ALL_DAY">.after_expiry` | `<a page
        saying the QR-code has expired>` | (type: `schedule`) Same as
        `data.after_expiry`, but for the specified DotW and time. |

        | `data.timezone` | `<server's timezone>` | (type: `schedule`) The
        timezone that will apply to the schedule, has to be specified in the TZ
        format. See more
        [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones). |

        | | |

        | `data.zones` | N/A | (type: `location`) An array containing all of the
        zone information for the `location` type |

        | `data.zones.*` | N/A | (type: `location`) An object containing the
        zone information for the `location` type |

        | `data.zones.*.type` | N/A | (type: `location`) Defines what the form
        of the zone is. Supported forms: `polygon`, `circle` |

        | `data.zones.*.priority` | `0` | (type: `location`) Defines what
        priority this zone has, this is used when 2 zones are overlapping. The
        one with the highest priority will be chosen |

        | `data.zones.*.isEntireWorld` | N/A | (type: `location`) Defines if a
        zone is covering the entire world. A polygon zone covering the entire
        world is defined as a fallback, and should have a priority of `-1000`.
        The server does not check this and unexpected outcomes may occur if this
        is not set correctly. |

        | `data.zones.*.positions` | N/A | (type: `location`) An array of
        polygon points specified in the `[[lat, long], ...]` format |

        | `data.zones.*.center` | N/A | (type: `location`) The center of a
        circle zone specified in the `[lat, long]` format |

        | `data.zones.*.radius` | N/A | (type: `location`) The radius (in
        meters) of the circle zone |

        | `data.zones.*.redirectTo` | N/A | (type: `location`) Same as
        `data.redirect_to`, but for the `location` type |

        | `data.zones.*.afterExpiry` | `<a page saying the QR-code has expired>`
        | (type: `location`) Same as `data.after_expiry`, but for the `location`
        type |

        | | |

        | `data.userAgents` | N/A | (type: `user-agent`) An array containing the
        user-agents |

        | `data.userAgents.*` | N/A | (type: `user-agent`) An object containing
        more information about a user-agent |

        | `data.userAgents.*.browser` | N/A | (type: `user-agent`) A regex
        string for a user-agent that determines if it's a browser that you're
        looking for |

        | `data.userAgents.*.browser_name` | N/A | (type: `user-agent`) A
        user-friendly name for the browser you're looking for |

        | `data.userAgents.*.os` | N/A | (type: `user-agent`) A regex string for
        a user-agent that determines if it's an OS that you're looking for |

        | `data.userAgents.*.os_name` | N/A | (type: `user-agent`) A
        user-friendly name for the OS you're looking for |

        | `data.userAgents.*.redirect_to` | N/A | (type: `user-agent`) Same as
        `data.redirect_to`, but for the `user-agent` type |

        | `data.userAgents.*.after_expiry` | `<a page saying the QR-code has
        expired>` | (type: `user-agent`) Same as `data.after-expiry`, but for
        the `user-agent` type |

        | | |

        | `expires` | `null` | When the QR-code expires, has to be `null` or be
        specified in the `YYYY-MM-DDTHH:MM` format, example (Feb 6th, 2024 @
        1:06 PM): `2024-02-06T13:06`. |

        | `name` | `null` | The QR-code's name, this name shows up on the
        DynamicQR UI. Max 50 chars, has to be `null` or a string. |

        | `description` | `null` | The QR-code's description, this description
        shows up on the DynamicQR UI. Max 200 chars, has to be `null` or a
        string. |

        | `settings` | `{}` | The settings that the QR-code follows. |

        | `settings.getScanData` | `true` | Get information about each scan. |

        | `settings.scanData` | `{}` | More in-depth settings about what to
        collect, beware of your country's privacy laws, as this could violate
        them. |

        | `settings.scanData.information` | `{}` | The types of scan data to
        grab. |

        | `settings.scanData.information.fingerprint` | `false` | Grab the
        scanning device's fingerprint. |

        | `settings.scanData.information.user-agent` | `false` | Grab the
        scanning device's user-agent. |

        | `settings.scanData.information.ip` | `false` | Grab the scanning
        device's IP address. |

        | `settings.scanData.information.location` | `false` | Grab the scanning
        device's location. |

        | `settings.scanData.sendToURL` | `false` | Sends the collected scan
        data to the website that the user gets redirected to. This is done
        passing a signed JWT token through the `ql_scan` query parameter on the
        redirect website.  |

        | `settings.scanData.JWTEncryptionKey` | `""` | The key used to sign the
        scan data. This has to be provided if `settings.scanData.sendToURL` is
        set to true |

        | `settings.requirements` | `{}` | Define what has to be sent for the
        user to be able to get redirected |

        | `settings.requirements.location` | `false` | Only allow redirect if
        user has allowed us to grab location. Only works if
        `settings.scanData.information.location` and `settings.getScanData` are
        both set to `true` |

        | `settings.requirements.user-agent` | `false` | Only allow redirect if
        user has allowed us to grab device and browser information. Only works
        if `settings.scanData.information.user-agent` and `settings.getScanData`
        are both set to `true` |


        # QRLink API-keys

        This endpoint supports using QRLink API-keys. You can create one using
        the `POST /api/v1/user/api-keys` endpoint. To create a QRLink-code using
        an API-key, the API key needs the `qrcode:create` permission set, and
        the owner of the QRLink-code must exist. Keep in mind that the
        QRLink-code will be linked to the owner of the API-key.


        To use an API-key for a request, specify it's token in the
        `Authorization` header. All API-keys also need to start with `Bearer `
        if you want the API to understand that you are trying to use an API-key.
