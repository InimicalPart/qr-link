#! The NginX configuration file for the QRLink server.
#! Editing this file will not affect the server, as for security reasons, the server uses it's version of the file.
#! To edit the configuration file, you must edit the file in the server's file system and then restart the server.
#!
#! This file can be found at /etc/nginx/conf.d/QRLink.conf


#? Gzip it all, increases performance
gzip on; 
gzip_vary on; 
gzip_min_length 1024; 
gzip_proxied expired no-cache no-store private auth; 
gzip_disable "MSIE [1-6]\.";
gzip_comp_level 2;
gzip_types text/plain text/html text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript;

#? HTTPS -> :8080 (NextJS)
server {
    listen [::]:443 ssl http2; #? IPv4 SSL
    listen 443 ssl http2 ipv6only=on; #? IPv6 SSL 
    
    server_name qrlink.newseed.se;

    location = /unavailable.html {
        root /var/www/errors;
        internal;
    }

    location / {
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_intercept_errors on;
        error_page 500 501 502 503 504 505 /unavailable.html;
        proxy_pass http://127.0.0.1:8080; #? NextJS
    }


    ssl_certificate /etc/letsencrypt/live/qrlink.newseed.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrlink.newseed.se/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}

server {
    listen 80;
    listen [::]:80;
    server_name qrlink.newseed.se;
    
    if ($host = qrlink.newseed.se) {
        return 301 https://$host$request_uri;
    }
}