name: mongodb-qrlink
services:
    qrlink:
        environment:
            - API_URL=http://localhost:3000
            - UI_URL=http://localhost:8080
            - IS_DOCKER=1
        hostname: QRLink
        container_name: QRLink
        privileged: true
        init: true
        cap_add:
            - SYS_ADMIN
        networks:
            MDBQRL: # MongoDB-QRLink
              ipv4_address: "172.16.238.2"
        ports:
            - 3000:3000
            - 8080:8080
        restart: on-failure:3
        cpus: 0.5
        mem_limit: 1G
        mem_reservation: 512M
        deploy:
          resources:
            limits:
              cpus: '0.50'
              memory: 1G
            reservations:
              cpus: '0.25'
              memory: 512M
        image: qrlink
        depends_on:
          mongo:
            condition: service_healthy
            required: true
        build:
            context: .
            dockerfile: docker/qrlink.Dockerfile
    mongo:
      hostname: MongoQRL
      container_name: MongoQRL
      environment:
        - IS_DOCKER=1
      privileged: true
      init: true
      cap_add:
          - SYS_ADMIN
      networks:
          MDBQRL: # MongoDB-QRLink
            ipv4_address: "172.16.238.3"
      ports:
        - 27017:27017
        # 3010 internal for API control
      restart: on-failure:3
      cpus: 0.5
      mem_limit: 1G
      mem_reservation: 512M
      deploy:
        resources:
          limits:
            cpus: '0.50'
            memory: 1G
          reservations:
            cpus: '0.25'
            memory: 512M
      volumes:
        - MongoQRL-DATA:/data/db
        - MongoQRL-CONFIG:/data/configdb
      image: mongoqrl
      build:
        context: .
        dockerfile: docker/mongoqrl.Dockerfile
networks:
  MDBQRL: # MongoDB-QRLink
    driver: bridge
    ipam:
      config:
        - subnet: "172.16.238.0/24"
volumes:
  MongoQRL-DATA:
  MongoQRL-CONFIG: