[supervisord]
nodaemon=true

[program:api]
command=/bin/bash -c 'cd /app && /usr/bin/npm run build_and_run --prefix /app'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:nextjs]
command=/bin/bash -c 'cd /app/frontend && /usr/bin/npm run build_and_run --prefix /app/frontend'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
